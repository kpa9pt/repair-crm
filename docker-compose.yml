services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: repair_crm
      POSTGRES_HOST_AUTH_METHOD: trust  # <- КЛЮЧЕВАЯ СТРОКА
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: unless-stopped

  nginx:
    container_name: nginx
    build:
      context: .
      dockerfile: services/nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_web:/var/www/certbot
      - ./state:/etc/nginx/state

    healthcheck:
#      test: [ "CMD", "curl", "-f", "http://localhost/.well-known/acme-challenge/healthcheck" ]
      test: [ "CMD", "nginx", "-t" ]  # проверяет только конфиг
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    restart: unless-stopped

  certbot:
    container_name: certbot
    build:
      context: .
      dockerfile: services/certbot/Dockerfile
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_web:/var/www/certbot
    env_file:
      - .env
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
    depends_on:
      nginx:
        condition: service_healthy  # ← ждем здоровый nginx
    healthcheck:
      # Проверяем, что скрипт дошел до бесконечного цикла (процесс sleep существует)
      test: [ "CMD", "sh", "-c", "pgrep -f 'sleep 12h' || pgrep -f 'sleep 3600' || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    restart: unless-stopped

  watchdog:
    build:
      context: .
      dockerfile: services/watchdog/Dockerfile
    container_name: watchdog

    volumes:
      - ./state:/state
      - /var/run/docker.sock:/var/run/docker.sock

    environment:
      STATE_PATH: /state/state.json
      WORKDIR: /app


    mem_limit: 64m
    cpus: "0.2"

    healthcheck:
      test: [ "CMD", "python", "-c", "print('ok')" ]
      interval: 30s
      timeout: 3s
      retries: 3

    depends_on:
      nginx:
        condition: service_healthy
    restart: unless-stopped

  gateway-blue:
    container_name: gateway-blue
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    expose:
      - "8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/repair_crm}

    command:
      [
        "uvicorn",
        "services.gateway.app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--proxy-headers",
        "--forwarded-allow-ips='*'"
      ]

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  gateway-green:
    container_name: gateway-green
    build:
      context: .
      dockerfile: services/gateway/Dockerfile
    expose:
      - "8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/repair_crm}

    command:
      [
        "uvicorn",
        "services.gateway.app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000",
        "--proxy-headers",
        "--forwarded-allow-ips='*'"
      ]

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  auth-blue:
    container_name: auth-blue
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    expose:
      - "8001"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/repair_crm}
      SECRET_KEY: ${SECRET_KEY:-my-super-secret-key-for-jwt-change-me-in-production}
    command:
      [
        "uvicorn",
        "services.auth.app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001"
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    restart: unless-stopped

  auth-green:
    container_name: auth-green
    build:
      context: .
      dockerfile: services/auth/Dockerfile
    expose:
      - "8001"
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/repair_crm}
      SECRET_KEY: ${SECRET_KEY:-my-super-secret-key-for-jwt-change-me-in-production}
    command:
      [
        "uvicorn",
        "services.auth.app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8001"
      ]
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8001/health')"
        ]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M
    restart: unless-stopped

  migrations:
    build:
      context: .
      dockerfile: services/migrations/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/repair_crm}
    depends_on:
      postgres:
        condition: service_healthy

  rabbitmq:
    image: rabbitmq:3.13-management-alpine
    container_name: rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASS:-guest}
    ports:
      - "15672:15672"    # Management UI
    expose:
      - "5672"
    healthcheck:
      test: [ "CMD", "rabbitmq-diagnostics", "-q", "ping" ]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  telegram-bot:
    mem_limit: 256m
    build:
      context: .
      dockerfile: services/telegram-bot/Dockerfile
    container_name: telegram-bot
    env_file:
      - .env
    environment:
      TELEGRAM_TOKEN: ${TELEGRAM_TOKEN}
      RABBITMQ_HOST: ${RABBITMQ_HOST:-rabbitmq}
      RABBITMQ_PORT: ${RABBITMQ_PORT:-5672}
      RABBITMQ_USER: ${RABBITMQ_USER:-guest}
      RABBITMQ_PASS: ${RABBITMQ_PASS:-guest}
      CHAT_ID: ${TELEGRAM_CHAT_ID:-}
      HTTP_PROXY: socks5://195.135.254.115:10080
      HTTPS_PROXY: socks5://195.135.254.115:10080
      ALL_PROXY: socks5://195.135.254.115:10080
      NO_PROXY: localhost,127.0.0.1,rabbitmq
    depends_on:
      rabbitmq:
        condition: service_healthy
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

volumes:
  postgres_data:
    name: repair_crm_postgres_data
    external: true
  certbot_conf:
  certbot_web:
  rabbitmq_data: