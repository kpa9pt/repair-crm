services:
  postgres:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: repair_crm
      POSTGRES_HOST_AUTH_METHOD: trust  # <- КЛЮЧЕВАЯ СТРОКgi
    expose:
      - "5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U postgres" ]
      interval: 5s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          memory: 512M
        reservations:
          memory: 256M
    restart: unless-stopped

  nginx:
    container_name: nginx
    build:
      context: .
      dockerfile: services/nginx/Dockerfile
    ports:
      - "80:80"
      - "443:443"
    env_file:
      - .env
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_web:/var/www/certbot
      - nginx_state:/etc/nginx/state
    healthcheck:
#      test: [ "CMD", "curl", "-f", "http://localhost/.well-known/acme-challenge/healthcheck" ]
      test: [ "CMD", "nginx", "-t" ]  # проверяет только конфиг
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 64M
        reservations:
          memory: 32M
    restart: unless-stopped

  certbot:
    container_name: certbot
    build:
      context: .
      dockerfile: services/certbot/Dockerfile
    volumes:
      - certbot_conf:/etc/letsencrypt
      - certbot_web:/var/www/certbot
    env_file:
      - .env
    environment:
      DOMAIN_NAME: ${DOMAIN_NAME:-localhost}
    depends_on:
      nginx:
        condition: service_healthy  # ← ждем здоровый nginx
    healthcheck:
      # Проверяем, что скрипт дошел до бесконечного цикла (процесс sleep существует)
      test: [ "CMD", "sh", "-c", "pgrep -f 'sleep 12h' || pgrep -f 'sleep 3600' || exit 1" ]
      interval: 5s
      timeout: 3s
      retries: 60
      start_period: 60s
    deploy:
      resources:
        limits:
          memory: 128M
        reservations:
          memory: 64M
    restart: unless-stopped

  x-gateway-base: &gateway-base

    expose:
      - "8000"

    env_file:
      - .env

    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/repair_crm}

    command:
      [
        "uvicorn",
        "services.gateway.app.main:app",
        "--host",
        "0.0.0.0",
        "--port",
        "8000"
      ]

    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"
        ]
      interval: 5s
      timeout: 3s
      retries: 10

    restart: unless-stopped

    deploy:
      resources:
        limits:
          memory: 256M
        reservations:
          memory: 128M

  gateway-blue:
    <<: *gateway-base
    container_name: gateway-blue
    build:
      context: .
      dockerfile: services/gateway/Dockerfile

  gateway-green:
    <<: *gateway-base
    container_name: gateway-green
    build:
      context: .
      dockerfile: services/gateway/Dockerfile

  migrations:
    build:
      context: .
      dockerfile: services/migrations/Dockerfile
    env_file:
      - .env
    environment:
      DATABASE_URL: ${DATABASE_URL:-postgresql+asyncpg://postgres:postgres@postgres:5432/repair_crm}
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  postgres_data:
  certbot_conf:
  certbot_web:
  nginx_state: