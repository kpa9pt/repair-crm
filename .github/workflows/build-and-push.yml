name: Build and Push to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Generate patterns from service registry
        run: |
          python scripts/generate_changed_files_patterns.py > patterns.txt

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files_from_source_file: patterns.txt

      - name: Detect changed services
        id: services
        run: |
          python scripts/detect_changed_services.py > services.json
          echo "services=$(cat services.json | jq -c .)" >> $GITHUB_OUTPUT
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}

      - name: Print changed services
        run: |
          echo "Changed services: ${{ steps.services.outputs.services }}"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: fromJSON(steps.services.outputs.services).length > 0
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:${{ github.sha }}
        strategy:
          matrix:
            service: ${{ fromJSON(steps.services.outputs.services) }}

      - name: Build image manifest
        run: |
          python scripts/build_manifest.py > images.json
        env:
          CHANGED_SERVICES: ${{ steps.services.outputs.services }}
          GITHUB_SHA: ${{ github.sha }}

      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: images
          path: images.json