name: Build and Push to GHCR

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  # ===== ПЕРВАЯ ДЖОБА: определяем список сервисов =====
  prepare:
    runs-on: ubuntu-latest
    outputs:
      services: ${{ steps.services.outputs.services }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Generate patterns from service registry
        run: |
          python scripts/generate_changed_files_patterns.py > patterns.txt
        env:
          PYTHONPATH: .

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v44
        with:
          files_from_source_file: patterns.txt

      - name: Detect changed services
        id: services
        run: |
          python scripts/detect_changed_services.py > services.json
          echo "services=$(cat services.json | jq -c .)" >> $GITHUB_OUTPUT
        env:
          ALL_CHANGED_FILES: ${{ steps.changed-files.outputs.all_changed_files }}
          PYTHONPATH: .

      - name: Print changed services
        run: |
          echo "Changed services: ${{ steps.services.outputs.services }}"

  # ===== ВТОРАЯ ДЖОБА: собираем с matrix =====
  build:
    runs-on: ubuntu-latest
    needs: prepare
    permissions:
      contents: read
      packages: write
    if: needs.prepare.outputs.services != '[]'  # ← ИСПРАВЛЕНО!
    strategy:
      matrix:
        service: ${{ fromJSON(needs.prepare.outputs.services) }}
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v5
        with:
          context: .
          file: services/${{ matrix.service }}/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:latest
            ghcr.io/${{ github.repository }}-${{ matrix.service }}:${{ github.sha }}

  # ===== ТРЕТЬЯ ДЖОБА: собираем manifest =====
  manifest:
    runs-on: ubuntu-latest
    needs: [prepare, build]
    if: always()
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build image manifest
        run: |
          python scripts/build_manifest.py > images.json
        env:
          CHANGED_SERVICES: ${{ needs.prepare.outputs.services }}
          GITHUB_SHA: ${{ github.sha }}
          PYTHONPATH: .

      - name: Upload images artifact
        uses: actions/upload-artifact@v4
        with:
          name: images
          path: images.json