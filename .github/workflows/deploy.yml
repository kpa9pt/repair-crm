name: Deploy to VDS

on:
  workflow_run:
    workflows:
      - "Build and Push to GHCR"
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    env:
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Set deploy id
        run: echo "DEPLOY_ID=${{ github.event.workflow_run.id }}" >> $GITHUB_ENV

      - name: Check state file
        id: state
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            mkdir -p ~/repair-crm/state

            if [ -f ~/repair-crm/state/state.json ]; then
              echo 'exists=true'
            else
              echo 'exists=false'
            fi
          " >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      - name: State for runner
        if: steps.state.outputs.exists == 'true'
        run: |
          scp ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:~/repair-crm/state/state.json ./state.json


      - name: Bootstrap state
        if: steps.state.outputs.exists == 'false'
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}  # ← добавить
          PYTHONPATH: .  # ← добавить
        run: |
          python scripts/deploy/bootstrap_state.py > state.json

      - name: Upload state
        if: steps.state.outputs.exists == 'false'
        run: |
          scp state.json \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:~/repair-crm/state/state.json

      - name: Backup original state (server)
        run: |
          scp ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:~/repair-crm/state/state.json \
            state.backup.json


      - name: Download images artifact
        run: |
          gh run download ${{ github.event.workflow_run.id }} \
          -n images \
          -D .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
            
      # ===== ЗАГРУЖАЕМ БЕКАП С СЕРВЕРА =====
      - name: Download images backup from server
        run: |
          if ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "[ -f ~/repair-crm/state/images.failed.json ]"; then
            echo "📥 Downloading images backup from server..."
            scp ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:~/repair-crm/state/images.failed.json .
            echo "✅ images.failed.json downloaded"
          else
            echo "✅ No images backup on server"
          fi

      - name: Restore lost images from failed deploy
        run: |
          python scripts/deploy/merge_images.py
        env:
          PYTHONPATH: .

      - name: Sync registry to state (add new services)
        run: |
          python scripts/deploy/sync_registry_to_state.py
        env:
          PYTHONPATH: .

      - name: Update state
        run: |
          python scripts/deploy/update_state.py > new_state.json
          mv new_state.json state.json
        env:
          GITHUB_REPOSITORY_OWNER: ${{ github.repository_owner }}  # ← добавить если нет

      - name: Sync state to server (always)
        run: |
          scp state.json \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:~/repair-crm/state/state.json

      - name: Compute compose hashes from docker-compose.yml
        id: compose
        run: |
          python scripts/deploy/compute_compose_hashes.py > current_hashes.json
        env:
          PYTHONPATH: .  # ← добавить

      - name: Check which services have changed compose
        id: changed-compose
        run: |
          python scripts/deploy/check_compose_hashes.py > compose_changed.json
          CHANGED=$(cat compose_changed.json | jq -c .)
          echo "services=$CHANGED" >> $GITHUB_OUTPUT
        env:
          PYTHONPATH: .  # ← добавить

      - name: Encode compose plan
        run: |
          PLAN=$(cat compose_changed.json | jq -c . | base64 -w0)
          echo "COMPOSE_PLAN=$PLAN" >> $GITHUB_ENV

      - name: Check if deploy needed
        id: diff
        run: |
          python scripts/deploy/check_diff.py > deploy_plan.json

      - name: Print deploy plan
        run: |
          cat deploy_plan.json

      - name: Save deploy plan
        run: |
          PLAN=$(cat deploy_plan.json | jq -c . | base64 -w0)
          echo "DEPLOY_PLAN=$PLAN" >> $GITHUB_ENV

      - name: Debug DEPLOY_PLAN content
        run: |
          echo "=== DEPLOY_PLAN content ==="
          echo "${{ env.DEPLOY_PLAN }}"
          echo "=== HEX ==="
          echo -n "${{ env.DEPLOY_PLAN }}" | od -c
          echo "=== END ==="

      - name: Lock rollback (per service)
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "DEPLOY_PLAN='${{ env.DEPLOY_PLAN }}' python3 -" \
            < scripts/deploy/lock_rollback.py

      - name: Generate compose override
        run: |
          STATE_FILE=state.json 
          python scripts/deploy/render_compose.py > docker-compose.override.yml

      - name: Upload override to server
        run: |
          scp docker-compose.override.yml \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:~/repair-crm/docker-compose.override.yml

      - name: push to VDS
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "DATABASE_URL='${{ secrets.DATABASE_URL }}' \
             ADMIN_USERNAME='${{ secrets.ADMIN_USERNAME }}' \
             ADMIN_PASSWORD='${{ secrets.ADMIN_PASSWORD }}' \
             SECRET_KEY='${{ secrets.SECRET_KEY }}' \
             TELEGRAM_TOKEN='${{ secrets.TELEGRAM_TOKEN }}' \
             DOMAIN_NAME='${{ secrets.DOMAIN_NAME }}' \
             bash -s" < scripts/deploy/push_to_vds.sh

      - name: Recreate containers with changed compose
        if: steps.changed-compose.outputs.services != '[]'
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "COMPOSE_PLAN='${{ env.COMPOSE_PLAN }}' python3 -" \
            < scripts/deploy/recreate_containers.py

      - name: Verify ACTIVE services
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "DEPLOY_PLAN='${{ env.DEPLOY_PLAN }}' python3 -" \
            < scripts/deploy/verify_services.py

      - name: Wait for new services healthcheck
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "DEPLOY_PLAN='${{ env.DEPLOY_PLAN }}' python3 -" \
            < scripts/deploy/verify_inactive_services.py

      - name: Switch traffic (state-driven)
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "DEPLOY_PLAN='${{ env.DEPLOY_PLAN }}' python3 -" \
            < scripts/deploy/switch_services.py

      - name: Reload nginx
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            docker exec nginx /scripts/reload.sh
          "

      - name: Post-switch verify
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "DEPLOY_PLAN='${{ env.DEPLOY_PLAN }}' python3 -" \
            < scripts/deploy/post_switch_verify.py \
            > post_switch_verify.json

      - name: Print verify result
        run: |
          cat post_switch_verify.json

      - name: Save rollback decision (runner-only)
        run: |
          cat post_switch_verify.json | jq -c . > rollback_decision.json

          ROLLBACK=$(cat rollback_decision.json | base64 -w0)
          echo "ROLLBACK_DECISION=$ROLLBACK" >> $GITHUB_ENV

      - name: Unlock rollback
        id: unlock
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "ROLLBACK_DECISION='${{ env.ROLLBACK_DECISION }}' python3 -" \
            < scripts/deploy/unlock_rollback.py

      - name: Update compose hashes in state
        run: |
          # Скачиваем актуальный state с сервера
          scp ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:~/repair-crm/state/state.json ./state.json

          # Обновляем хеши
          python scripts/deploy/update_compose_hashes.py

          # Загружаем обратно
          scp state.json ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:~/repair-crm/state/state.json
        env:
          PYTHONPATH: .

      - name: Restore state backup
        if: always() && steps.unlock.outcome != 'success'
        run: |
          if [ -s state.backup.json ]; then
            echo "restoring backup state"
            scp state.backup.json \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:~/repair-crm/state/state.json
          else
            echo "backup empty - skip restore"
          fi

      # ✅ Бекапим images.json только если деплой провалился
      - name: Save images backup to server
        if: always() && steps.unlock.outcome != 'success'
        run: |
          if [ -f images.json ]; then
            echo "📦 Saving images backup to server..."
            scp images.json \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:~/repair-crm/state/images.failed.json
            echo "✅ images.failed.json saved to server"
          fi

      # ===== УДАЛЯЕМ БЕКАП С СЕРВЕРА ПРИ УСПЕХЕ =====
      - name: Remove images backup from server
        if: success()
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            if [ -f ~/repair-crm/state/images.failed.json ]; then
              rm ~/repair-crm/state/images.failed.json
              echo '✅ images.failed.json removed from server'
            fi
          "

      - name: Post Reload nginx
        if: always() && steps.unlock.outcome != 'success'
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            docker exec nginx /scripts/reload.sh
          "

      - name: Rollback engine
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          ROLLBACK_DECISION: ${{ env.ROLLBACK_DECISION }}
        run: |
          python scripts/deploy/run_rollbacks.py
          

      - name: Cleanup inactive containers
        if: always()
        env:
          SERVER_USER: ${{ secrets.SERVER_USER }}
          SERVER_IP: ${{ secrets.SERVER_IP }}
          DEPLOY_PLAN: ${{ env.DEPLOY_PLAN }}
        run: |
          ssh $SERVER_USER@$SERVER_IP \
            "DEPLOY_PLAN='$DEPLOY_PLAN' python3 -" \
            < scripts/deploy/cleanup.py
