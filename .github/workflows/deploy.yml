name: Deploy to VDS

on:
  workflow_run:
    workflows:
      - "Build and Push to GHCR"
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    env:
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Set deploy id
        run: echo "DEPLOY_ID=${{ github.event.workflow_run.id }}" >> $GITHUB_ENV

      - name: Check state file
        id: state
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            mkdir -p ~/repair-crm/state

            if [ -f ~/repair-crm/state/state.json ]; then
              echo 'exists=true'
            else
              echo 'exists=false'
            fi
          " >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4

      - name: State for runner
        if: steps.state.outputs.exists == 'true'
        run: |
          scp ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:~/repair-crm/state/state.json ./state.json


      - name: Bootstrap state
        if: steps.state.outputs.exists == 'false'
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          python scripts/deploy/bootstrap_state.py > state.json

      - name: Upload state
        if: steps.state.outputs.exists == 'false'
        run: |
          scp state.json \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:~/repair-crm/state/state.json

      - name: Download images artifact
        run: |
          gh run download ${{ github.event.workflow_run.id }} \
          -n images \
          -D .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update state
        run: |
          python scripts/deploy/update_state.py > new_state.json
          mv new_state.json state.json

      - name: Sync state to server (always)
        run: |
          scp state.json \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:~/repair-crm/state/state.json

      - name: Lock rollback
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            tmp=\$(mktemp)

            jq '.rollback_locked = true' \
              ~/repair-crm/state/state.json > \$tmp \
              && mv \$tmp ~/repair-crm/state/state.json
          "

      - name: Check if deploy needed
        id: diff
        run: |
          python scripts/deploy/check_diff.py

      - name: Generate compose override
        run: |
          STATE_FILE=state.json 
          python scripts/deploy/render_compose.py > docker-compose.override.yml

      - name: Upload override to server
        run: |
          scp docker-compose.override.yml \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:~/repair-crm/docker-compose.override.yml

      - name: push to VDS
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOFSSH'
          set -e

          mkdir -p ~/repair-crm
          cd ~/repair-crm

          curl -fsSL https://raw.githubusercontent.com/kpa9pt/repair-crm/main/docker-compose.yml -o docker-compose.yml
         
          
          echo '📝 Creating .env...'
          cat > .env << ENVEOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}
          DOMAIN_NAME=${{ secrets.DOMAIN_NAME }}
          ENVEOF
          
          echo '🚀 Starting services...'
          docker compose up -d
          EOFSSH

      - name: Verify ACTIVE gateway is healthy
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            set -e

            ACTIVE=\$(cat ~/repair-crm/state/state.json | jq -r '.services.gateway.active')

            if [ \"\$ACTIVE\" = \"blue\" ]; then
              SERVICE=\"gateway-blue\"
            else
              SERVICE=\"gateway-green\"
            fi

            echo \"🔍 Checking ACTIVE service: \$SERVICE\"

            for i in \$(seq 1 60); do
              if docker exec \$SERVICE python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\" 2>/dev/null; then
                echo \"✅ ACTIVE service is healthy\"
                break
              fi

              echo \"retry \$i...\"
              sleep 2
            done

            echo \"🔁 Reloading nginx config to ensure routing stability\"
            docker exec nginx nginx -s reload
          "

      - name: Wait for new service healthcheck
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} <<'SSH'
          set -e

          ACTIVE=$(cat ~/repair-crm/state/state.json | jq -r '.services.gateway.active')

          if [ "$ACTIVE" = "blue" ]; then
            INACTIVE="green"
          else
            INACTIVE="blue"
          fi
          
          echo "LOCAL INACTIVE=[$INACTIVE]"

          docker exec gateway-$INACTIVE python - <<'PY'
          import urllib.request
          import sys

          try:
            urllib.request.urlopen("http://localhost:8000/health", timeout=2)
          except Exception as e:
            print("healthcheck failed:", e)
            sys.exit(1)

          print("healthcheck OK")
          PY
          SSH

      - name: Switch traffic (state-driven)
        if: steps.diff.outputs.changed == 'true'
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            set -e

            STATE=~/repair-crm/state/state.json

            ACTIVE=\$(jq -r '.services.gateway.active' \$STATE)

            if [ \"\$ACTIVE\" = \"blue\" ]; then
              NEW=\"green\"
            else
              NEW=\"blue\"
            fi

            echo \"🔁 switching: \$ACTIVE → \$NEW\"

            # атомарно обновляем state НА СЕРВЕРЕ
            tmp=\$(mktemp)

            jq --arg v \"\$NEW\" '.services.gateway.active = \$v' \$STATE > \$tmp \
              && mv \$tmp \$STATE

            echo \"STATE updated\"
          "

      - name: Reload nginx
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            docker exec nginx nginx -s reload
          "

      - name: Post-switch smoke + soak healthcheck
        id: smoke
        continue-on-error: true
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            set -e

            echo '=== SMOKE CHECK (fast) ==='

            curl -fsS \
              --retry 30 \
              --retry-delay 2 \
              http://127.0.0.1/health

            echo 'SMOKE OK'

            echo '=== SOAK CHECK (delayed) ==='

            sleep 60

            curl -fsS \
              --retry 10 \
              --retry-delay 3 \
              http://127.0.0.1/health

            echo 'SOAK OK'
          "    

      - name: Unlock rollback
        if: steps.smoke.outcome == 'success'
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            tmp=\$(mktemp)

            jq '.rollback_locked = false' \
              ~/repair-crm/state/state.json > \$tmp \
              && mv \$tmp ~/repair-crm/state/state.json
          "

      - name: Rollback on failure
        if: steps.smoke.outcome == 'failure'
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "ROLLBACK_SERVICE=gateway python3 -" \
            < scripts/rollback.py

      - name: Cleanup inactive container
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            set -e

            echo '=== READ ACTUAL STATE ==='
            ACTIVE=\$(cat ~/repair-crm/state/state.json | jq -r '.services.gateway.active')

            if [ \"\$ACTIVE\" = \"blue\" ]; then
              INACTIVE=\"green\"
            else
              INACTIVE=\"blue\"
            fi

            echo \"Stopping inactive container: gateway-\$INACTIVE\"

            docker stop gateway-\$INACTIVE || true
          "

      - name: Cleanup old images
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            docker system prune -f
          "