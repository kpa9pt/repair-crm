name: Deploy to VDS

on:
  workflow_run:
    workflows:
      - "Build and Push to GHCR"
    types:
      - completed
  workflow_dispatch:

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    env:
      GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts

      - name: Set deploy id
        run: echo "DEPLOY_ID=${{ github.event.workflow_run.id }}" >> $GITHUB_ENV

      - name: Check state file
        id: state
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            mkdir -p ~/repair-crm/state

            if [ -f ~/repair-crm/state/state.json ]; then
              echo 'exists=true'
            else
              echo 'exists=false'
            fi
          " >> $GITHUB_OUTPUT

      - name: Checkout code
        uses: actions/checkout@v4

      - name: State for runner
        if: steps.state.outputs.exists == 'true'
        run: |
          scp ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:~/repair-crm/state/state.json ./state.json


      - name: Bootstrap state
        if: steps.state.outputs.exists == 'false'
        env:
          GHCR_READ_TOKEN: ${{ secrets.GHCR_READ_TOKEN }}
        run: |
          python scripts/deploy/bootstrap_state.py > state.json

      - name: Upload state
        if: steps.state.outputs.exists == 'false'
        run: |
          scp state.json \
            ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:~/repair-crm/state/state.json

      - name: Download images artifact
        run: |
          gh run download ${{ github.event.workflow_run.id }} \
          -n images \
          -D .
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Update state
        run: |
          python scripts/deploy/update_state.py > new_state.json
          mv new_state.json state.json

      - name: Sync state to server (always)
        run: |
          scp state.json \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:~/repair-crm/state/state.json

      - name: Lock rollback
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            tmp=\$(mktemp)

            jq '.rollback_locked = true' \
              ~/repair-crm/state/state.json > \$tmp \
              && mv \$tmp ~/repair-crm/state/state.json
          "

      - name: Check if deploy needed
        id: diff
        run: |
          python scripts/deploy/check_diff.py > deploy_plan.json

      - name: Print deploy plan
        run: |
          cat deploy_plan.json

      - name: Save deploy plan
        run: |
          echo "DEPLOY_PLAN=$(cat deploy_plan.json | jq -c .)" >> $GITHUB_ENV

      - name: Generate compose override
        run: |
          STATE_FILE=state.json 
          python scripts/deploy/render_compose.py > docker-compose.override.yml

      - name: Upload override to server
        run: |
          scp docker-compose.override.yml \
              ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }}:~/repair-crm/docker-compose.override.yml

      - name: push to VDS
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} << 'EOFSSH'
          set -e

          mkdir -p ~/repair-crm
          cd ~/repair-crm

          curl -fsSL https://raw.githubusercontent.com/kpa9pt/repair-crm/main/docker-compose.yml -o docker-compose.yml
         
          
          echo '📝 Creating .env...'
          cat > .env << ENVEOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}
          DOMAIN_NAME=${{ secrets.DOMAIN_NAME }}
          ENVEOF
          
          echo '🚀 Starting services...'
          docker compose up -d
          EOFSSH

      - name: Verify ACTIVE services
        run: |
          printf '%s' '${{ env.DEPLOY_PLAN }}' | ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "python3 -" < scripts/deploy/verify_services.py

      - name: Wait for new services healthcheck
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "DEPLOY_PLAN='${{ env.DEPLOY_PLAN }}' python3 -" \
            < scripts/deploy/verify_inactive_services.py

      - name: Switch traffic (state-driven)
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "DEPLOY_PLAN='${{ env.DEPLOY_PLAN }}' python3 -" \
            < scripts/deploy/switch_services.py

      - name: Reload nginx
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            docker exec nginx /scripts/reload.sh
          "

      - name: Post-switch smoke + soak healthcheck
        id: smoke
        continue-on-error: true
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            set -e

            echo '=== SMOKE CHECK (fast) ==='

            curl -fsS \
              --retry 30 \
              --retry-delay 2 \
              http://127.0.0.1/health

            echo 'SMOKE OK'

            echo '=== SOAK CHECK (delayed) ==='

            sleep 60

            curl -fsS \
              --retry 10 \
              --retry-delay 3 \
              http://127.0.0.1/health

            echo 'SOAK OK'
          "    

      - name: Unlock rollback
        if: steps.smoke.outcome == 'success'
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            tmp=\$(mktemp)

            jq '.rollback_locked = false' \
              ~/repair-crm/state/state.json > \$tmp \
              && mv \$tmp ~/repair-crm/state/state.json
          "

      - name: Rollback on failure
        if: steps.smoke.outcome == 'failure'
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} \
            "ROLLBACK_SERVICE=gateway python3 -" \
            < scripts/rollback.py

      - name: Cleanup inactive container
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            set -e

            echo '=== READ ACTUAL STATE ==='
            ACTIVE=\$(cat ~/repair-crm/state/state.json | jq -r '.services.gateway.active')

            if [ \"\$ACTIVE\" = \"blue\" ]; then
              INACTIVE=\"green\"
            else
              INACTIVE=\"blue\"
            fi

            echo \"Stopping inactive container: gateway-\$INACTIVE\"

            docker stop gateway-\$INACTIVE || true
          "

      - name: Cleanup old images
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            docker system prune -f
          "