name: Deploy to VDS

on:
  workflow_run:
    workflows:
      - "Build and Push to GHCR"
    types:
      - completed

jobs:
  deploy:
    if: >
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-latest
    steps:
      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.SERVER_SSH_KEY }}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -H ${{ secrets.SERVER_IP }} >> ~/.ssh/known_hosts


      - name: Deploy to VDS
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
          set -e


#          rm -rf ~/repair-crm
          mkdir -p ~/repair-crm
          cd ~/repair-crm

          curl -fsSL https://raw.githubusercontent.com/kpa9pt/repair-crm/main/docker-compose.yml -o docker-compose.yml
          curl -fsSL https://raw.githubusercontent.com/kpa9pt/repair-crm/main/docker-compose.prod.yml -o docker-compose.override.yml
#          curl -fsSL https://raw.githubusercontent.com/kpa9pt/repair-crm/main/docker-compose.prod.yml -o docker-compose.prod.yml


          echo '📝 Creating .env...'
          cat > .env << EOF
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          ADMIN_USERNAME=${{ secrets.ADMIN_USERNAME }}
          ADMIN_PASSWORD=${{ secrets.ADMIN_PASSWORD }}
          SECRET_KEY=${{ secrets.SECRET_KEY }}
          TELEGRAM_TOKEN=${{ secrets.TELEGRAM_TOKEN }}
          DOMAIN_NAME=${{ secrets.DOMAIN_NAME }}
          EOF
          
#          docker compose \
#          -f docker-compose.yml \
#          -f docker-compose.override.yml \
#          pull
#          docker compose pull
          
          echo '🚀 Starting services...'
#          docker compose \
#          -f docker-compose.yml \
#          -f docker-compose.prod.yml \
#          up -d --remove-orphans
#          docker compose up -d --remove-orphans
               
               
          docker compose up -d --pull always --remove-orphans
          "


          

      - name: Cleanup old images
        run: |
          ssh ${{ secrets.SERVER_USER }}@${{ secrets.SERVER_IP }} "
            docker system prune -f
          "