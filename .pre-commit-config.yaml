repos:
  - repo: https://github.com/psf/black
    rev: 24.4.0
    hooks:
      - id: black

  - repo: https://github.com/pycqa/flake8
    rev: 7.1.0
    hooks:
      - id: flake8
        args:
          [
            --config=.flake8,
            --max-line-length=88,
            --extend-ignore=E203,
          ]